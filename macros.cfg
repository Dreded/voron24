#Custimizations for fluid.cfg
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 345.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 350.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 10.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract          : 10.0   ; the value to retract while PAUSE
variable_cancel_retract   : 10.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 10.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : True ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
#                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
# !!! Custom macros, please use with care and review the section of the corresponding macro.
# These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
# Only  single line commands are supported, please create a macro if you need more than one command.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:

[gcode_macro M600]
description: Filament change
gcode:
    M118 Change Filament!
    PAUSE X=175 Y=20 Z_MIN=50 ;Z_MIN park toolhead atleast this high so I can see filament
    FILAMENT_UNLOAD

[gcode_macro G32]
gcode:
    M118 LVL Bed & Gantry
    BED_MESH_CLEAR
    QUAD_GANTRY_LEVEL
    ;G28 Z
    CARTOGRAPHER_TOUCH_HOME ; Home for real Z0
    BED_MESH_CALIBRATE ADAPTIVE=1

[gcode_macro PRINT_START]
variable_chambertemp: 0
gcode:
    # Parameters
    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.HOTEND|int %}
    {% set chambertemp = params.CHAMBER|default(0)|int %}
    {% set bed_type = params.BED_TYPE|default("Textured PEI Plate") %}
    {% set material = params.MATERIAL|default("None") %}
    {% set filament_id = material.split(':')[-1]|default("None") %}
    {% if filament_id != "None" %}
      SET_ACTIVE_SPOOL ID={filament_id}
    {% endif %}
    M118 Bed = {bed_type}
    CLEAR_PAUSE
    G90                 ; make sure we're in absolute mdoe
    SET_GCODE_OFFSET Z=0 ; Reset Z offset
     # Start heating everything Then home, finally wait for bed/nozzle temp
    CHAMBERRGB r=0.5
    HOTRGB R=0.5
    M118 Heating Up
    M140 S{bedtemp}
    M104 S150
    Smart_Home                  ;Centers Tool for Chamber Heatup
    M190 S{bedtemp}             ;Wait for bed heat.
    M109 S150                   ;Heat to 150 if not there yet. - Cartograpgher suggests 150 instead of old 180
    M118 Chamber: {chambertemp}
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chambertemp}   ; wait for chamber temp and allow bed soak
    G32 ; home and level
    Smart_Park
    M118 Heating Nozzle
    M109 S{hotendtemp}
    {% if bed_type == "Supertack Plate" %}
      M118 Add Glass Plate
      PAUSE
      SET_GCODE_OFFSET Z_ADJUST=3.93 MOVE=1 ; Adjust for Ender3 Glass Plate
    {% elif bed_type == "Textured PEI Plate" %}
      # SET_GCODE_OFFSET Z_ADJUST=-0.025 MOVE=1
    {% endif %}
    LINE_PURGE
    ;CLEAN_NOZZLE_AND_PURGE
    ;CENTER_TOOLHEAD             ;avoid the nozzle going across the build plate really low from edge
    M118 Autobot Roll Out!
    LED_ON
   

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning
    G0 X5.0 Y5.0 F20000            ; move nozzle to remove stringing
    G0 Z1.00                       ;move z after y and x to wipe string into print rather than have a wisp of hair.
    ;TURN_OFF_HEATERS
    CLEAN_NOZZLE BRUSH_TEMP=230                ; Will Heat nozzle up.. no reason to wait for it to cool then imediately heat if we just printed.
    M104 S150                      ;nozzle down to 150 as to not burn filament while idle.
    M107                           ; turn off fan
    G91                            ; relative positioning (Cleanb nozzle would of returned in Absolute)
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    MOVE_TO_CORNER                 ; park nozzle at rear
    CLEAR_ACTIVE_SPOOL
    BED_MESH_CLEAR
    # LED_OFF                      ; Moved to idle_timeout in printer.cfg(turns off at idle_timeout)
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.0
    M118 Job Done!

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

[gcode_macro PRIME_LINE]
gcode: 
    M118 Prime Line
    G1 X140 Y0 F9000.0   ;Move to start position
    G1 Z0.28             ;Move to a high Z Height(high relative to 0.2)
    G92 E0.0             ;Reset Extruder
    G1 X180 E10 F1000.0  ;Draw the first line
    G1 Y1 F1000          ;Move Over
    G1 X140 E6.0 F1000.0 ;draw second line
    G1 E-0.5 F3000       ;retract to avoid stringing
    G1 X141 E0 F1000     ;wipe back to break string
    G1 X135 E0 F1000     ;wipe forward to break string
    G92 E0.0             ;Reset Extruder

[gcode_macro IDLE_TIME]
gcode:
    {% set minute = params.M|default(none) %}
    {% set hour = params.H|default(none) %}

    {% if hour is none and minute is none %}
    {% set hour = 0 %}
    {% set minute = 30 %}
    {% else %}
    {% set hour = hour|default(0)|int %}
    {% set minute = minute|default(0)|int %}
    {% endif %}

    {% set time = (hour*60*60) + (minute*60) %}

    M118 Setting Idle Time for {hour}H and {minute}M
    SET_IDLE_TIMEOUT TIMEOUT={time}

[gcode_macro Smart_Home]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M118 Homing XYZ
        G28
    {% else %}
        M118 All axes already homed, centering toolhead.
        CENTER_TOOLHEAD
    {% endif %}

[gcode_macro CENTER_TOOLHEAD]
gcode:
    {% set z = params.Z|default(30)|float %}
    # Go to the Middle
    {% set x_middle = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set y_middle = printer.toolhead.axis_maximum.y|float / 2 %}
    G90
    G0 X{x_middle} Y{y_middle} Z{z} F12000

[gcode_macro MOVE_FRONT_CENTER]
gcode:
    # Go to the Middle
    {% set x_middle = printer.toolhead.axis_maximum.x|float / 2 %}
    G90
    G0 X{x_middle} Y20 Z50 F12000
    
[gcode_macro MOVE_TO_CORNER]
gcode:
    G90
    ##### set defaults #####
    {% set x = params.X|default(printer.toolhead.axis_maximum.x|float -10 ) %}      #edit to your park position
    {% set y = params.Y|default(printer.toolhead.axis_maximum.y|float -10 ) %}      #edit to your park position
    {% set z = params.Z|default(50)|float %} #edit to your park position
    {% set e = params.E|default(1) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    G91
    G1 Z{z_safe}
    G90
    G1 X{x} Y{y} F12000
[gcode_macro FILAMENT_SENSOR_LOAD]
gcode:
    ; --- Initial setup ---
    {% set current_temp = printer.extruder.temperature %}
    {% set target_temp = printer.extruder.target %}
    {% set ns = namespace(do_load=false, distance=80) %} ; G2E is 80mm from Start of gears to Nozzle

    ; --- Determine if we can proceed with loading ---
    {% if current_temp > 200 %}
        {% set ns.do_load = true %}
        M118 Filament Autoloading...
    {% elif target_temp > 200 %}
        ; Hotend not hot enough yet, do a small grab and wait
        {action_respond_info('Hotend not hot enough, waiting for heat before full load')}
        SAVE_GCODE_STATE NAME=AUTOLOAD_STATE
        M83                     ; Set extruder to relative mode
        M118 Extruder Grabbing filament… holding for heat
        G0 E10 F1000            ; Grab filament safely before hot
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_temp}
        RESTORE_GCODE_STATE NAME=AUTOLOAD_STATE
        {% set ns.do_load = true %}
        {% set ns.distance = ns.distance - 10 %} ; Minus the 10mm already moved for grab
    {% else %}
        SAVE_GCODE_STATE NAME=AUTOLOAD_STATE
        M83                     ; Set extruder to relative mode
        M118 Extruder too cold, Grabbing Filament. You deal with it from here...
        G0 E10 F1000            ; Grab filament safely before hot
        RESTORE_GCODE_STATE NAME=AUTOLOAD_STATE
    {% endif %}

    ; --- Perform full filament load if allowed ---
    {% if ns.do_load %}
        {% if printer.pause_resume.is_paused %}
            M118 Printer is paused, loading filament without retraction. ; we assume we're about to resume a print
            FILAMENT_LOAD RETRACT=0 DISTANCE={ns.distance}
        {% else %}
            M118 Printer no paused, loading filament with 10mm retraction after.
            FILAMENT_LOAD RETRACT=10 DISTANCE={ns.distance}
        {% endif %}
    {% endif %}

[gcode_macro FILAMENT_LOAD]
gcode:
    {% set retract = params.RETRACT|default(10)|float %}
    {% set purge = params.PURGE|default(20)|float %}
    {% set distance = params.DISTANCE|default(80)|float %} ; G2E is 80mm to Nozzle Including Extruder Gear
    M83                   # Put the extruder into relative mode
    G92 E0.0              # Reset the extruder so that it thinks it is at position zero
    G1 E80 F360           # Forward {Distance} at a speed of 6mm/s (360mm/min)
    G1 E{purge} F360      # {Purge} at a speed of 6mm/s (360mm/min)
    G1 E-{retract} F2400  # Retract
    G92 E0.0              # Reset the extruder again
    M82                   # Put the extruder back into absolute mode.

[gcode_macro FILAMENT_UNLOAD]
gcode:
    M83                   # Put the extruder into relative mode
    G92 E0.0              # Reset the extruder so that it thinks it is at position zero
    G1 E-100 F2400        # Move the extruder backward 100mm at a speed of 40mm/sec
    G92 E0.0              # Reset the extruder again
    M82                   # Put the extruder back into absolute mode.

[gcode_macro HEAT_SOAK]
description: heats the bed for a while
gcode:
    {% set TARGET = params.TARGET | default(0) %}
    {% set PERIOD = (params.PERIOD | default(60) | int) %} ## minutes

    ;; put the bed and nozzle where they're a safe distance apart
  #  G28
    # CENTER

    # M84 ;; turn off steppers

    # ;; run the fan to circulate air
    # _SET_FAN_SPEED PERCENT=50

    M190 S{ TARGET } ; wait for bed temp

    RESPOND TYPE=command MSG="will soak for { PERIOD }m"
    G4 P{ PERIOD * 1000 * 60 }



[gcode_macro QUAD_GANTRY_LEVEL_QUICK_Z]
gcode:
    # If QGL is not applied, first run a course calibration
    {% if printer.quad_gantry_level.applied == False %}
        QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0
    {% endif %}
    # then perform fine QGL down to desired spec
    # this has to be a separate macro call so the results of the above call will be visible!
    _FINE_QUAD_GANTRY_LEVEL

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=2.5
        ;QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=19.5 ; for big klciky
          # <- set your preferred probing height here!
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}

[gcode_macro TEST_SPEED]
# Home, get position, throw around toolhead, home again.
# If MCU stepper positions (first line in GET_POSITION) are greater than a full step different (your number of microsteps), then skipping occured.
# We only measure to a full step to accomodate for endstop variance.
# Example: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=10

description: Test for max speed and acceleration parameters for the printer. Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionfromMCU

gcode:
    # Speed
    {% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    # Iterations
    {% set iterations = params.ITERATIONS|default(5)|int %}
    # Acceleration
    {% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    # Minimum Cruise Ratio
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Bounding inset for large pattern (helps prevent slamming the toolhead into the sides after small skips, and helps to account for machines with imperfectly set dimensions)
    {% set bound = params.BOUND|default(20)|int %}
    # Size for small pattern box
    {% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}
    
    # Large pattern
        # Max positions, inset by BOUND
        {% set x_min = printer.toolhead.axis_minimum.x + bound %}
        {% set x_max = printer.toolhead.axis_maximum.x - bound %}
        {% set y_min = printer.toolhead.axis_minimum.y + bound %}
        {% set y_max = printer.toolhead.axis_maximum.y - bound %}
    
    # Small pattern at center
        # Find X/Y center point
        {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
        {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}
        
        # Set small pattern box around center point
        {% set x_center_min = x_center - (smallpatternsize/2) %}
        {% set x_center_max = x_center + (smallpatternsize/2) %}
        {% set y_center_min = y_center - (smallpatternsize/2) %}
        {% set y_center_max = y_center + (smallpatternsize/2) %}

    # Save current gcode state (absolute/relative, etc)
    SAVE_GCODE_STATE NAME=TEST_SPEED
    
    # Output parameters to g-code terminal
    { action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }
    
    # Home and get position for comparison later:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28
        # QGL if not already QGLd (only if QGL section exists in config)
        {% if printer.configfile.settings.quad_gantry_level %}
            {% if printer.quad_gantry_level.applied == False %}
                QUAD_GANTRY_LEVEL
                G28 Z
            {% endif %}
        {% endif %} 
        # Move 50mm away from max position and home again (to help with hall effect endstop accuracy - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/24)
        G90
        G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 X Y
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Go to starting position
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}

    # Set new limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        
        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
    
        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        
        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # Restore max speed/accel/accel_to_decel to their configured values
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio} 
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # Re-home and get position again for comparison:
        M400 # Finish moves - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/66
        G28 # This is a full G28 to fix an issue with CoreXZ - https://github.com/AndrewEllis93/Print-Tuning-Guide/issues/12
        # Go to XY home positions (in case your homing override leaves it elsewhere)
        G90
        G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
        G4 P1000 
        GET_POSITION

    # Restore previous gcode state (absolute/relative, etc)
    RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro CARTO_MEASURE_PLANARBACKLASH]
description: Calibrate backlash at each corner
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    { action_raise_error("Printer not homed!"   ) } {% endif %}
  {% if printer.configfile.settings.cartographer is not defined   %}
    { action_raise_error("[cartographer] not found!" ) } {% endif %}
  {% if printer.configfile.config.bed_mesh.zero_reference_position is not defined %}
    { action_raise_error("zero_reference_position not found!")} {% endif %}
    
  {% if printer.configfile.settings.z_tilt is defined %}
    {% set planeCfg = "z_tilt"        %}
    {% set planeCMD = "Z_TILT_ADJUST" %}
  {% elif printer.configfile.settings.quad_gantry_level is defined %} 
    {% set planeCfg = "quad_gantry_level" %}
    {% set planeCMD = "QUAD_GANTRY_LEVEL" %}
  {% elif printer.configfile.settings.z_tilt_ng is defined %}
    {% set planeCfg = "z_tilt_ng"     %}
    {% set planeCMD = "Z_TILT_ADJUST" %}
  {% else %}
    { action_raise_error("This printer has no ztilt / QGL ") }
  {% endif %}
  
  {% set planeDef = printer.configfile.settings[planeCfg] %}
  {% set planeRange = planeDef.points | count             %}
  {% if not printer[planeCfg].applied  %} 
    { action_raise_error("Plane not leveled, run " ~ planeCMD ~ " first") } {% endif %} 

  {% set moveSpeed  = planeDef['speed'] | int * 60  %}
  {% set moveAccel  = printer.configfile.config.printer.max_accel | int * 0.80 %}
  {% set moveHeight = 10 if planeDef['horizontal_move_z'] < 10 else planeDef['horizontal_move_z'] %}

  RESPOND PREFIX=💨 MSG="Moving Height: {moveHeight} Speed: {planeDef['speed']} Accel: {moveAccel} You have 4s to hit eStop"
  G4 P4000
  G90
  G0 Z{moveHeight}

  {% for i in range(planeRange) %}
    {% set testX = planeDef.points[i][0]|float %}
    {% set testY = planeDef.points[i][1]|float %}
    RESPOND PREFIX=🔢 MSG="Point {i+1}/{planeRange+1} ({planeCMD})"
    RESPOND PREFIX=📌 MSG="Tesing at X={testX} Y={testY}"

    G1 X{testX} Y{testY} Z{moveHeight} F{moveAccel}
    M400
    CARTOGRAPHER_ESTIMATE_BACKLASH
    M400
    G0 Z{moveHeight}
  {% endfor %}

  {% set posCenter = printer.configfile.config.bed_mesh.zero_reference_position %}
  {% set testX = posCenter.split(",")[0]|float %}
  {% set testY = posCenter.split(",")[1]|float %}
  RESPOND PREFIX=🚩 MSG="Point {planeRange+1}/{planeRange+1} (zero_reference_position)"
  RESPOND PREFIX=📌 MSG="Tesing at X={testX} Y={testY}"

  G1 X{testX} Y{testY} Z{moveHeight} F{moveAccel}
  M400
  CARTOGRAPHER_ESTIMATE_BACKLASH
  M400
  G0 Z{moveHeight}
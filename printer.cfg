# This file contains common pin mappings for the BigTreeTech Octopus.
# To use this config, the firmware should be compiled for the
# STM32F446 with a "32KiB bootloader" and a "12MHz crystal" clock reference.

# See docs/Config_Reference.md for a description of parameters.
[include ./KAMP_LiTE/*.cfg]
[include ./KOMB/KOMB.cfg]
[include config_backup.cfg]
[include fluidd.cfg]
;[include z_calibration.cfg]
[include macros.cfg]
[include homing.cfg]
#[include klicky/klicky-probe.cfg]
[include led_macro.cfg]
[include SB2209_CAN.cfg]
[include the_filter.cfg]
[include nozzle_scrub.cfg]
[mcu]
;serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_470022000B50534841313020-if00
#serial: /dev/ttyAMA0
#restart_method: command
canbus_uuid: cd43bd00a5ca

[mcu cartographer]
canbus_uuid: dca13ca8d2ad

;=================== CARTOGRAPGHER SPECIFIC ========================
[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 26 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: yes # For extra output

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[axis_twist_compensation]

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.
;=================== END CARTOGRAPGHER SPECIFIC ========================
[exclude_object]
[firmware_retraction]
[virtual_sdcard]
path: /home/ryanh/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 400  
max_accel: 4000    			#Max 4000
max_z_velocity: 25 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350   			#Max ?
square_corner_velocity: 5.0  #Can experiment with 8.0, default 5.

[input_shaper]
shaper_freq_x: 96.4
shaper_type_x: 3hump_ei
shaper_freq_y: 36.0
shaper_type_y: mzv


#[filament_switch_sensor material_0]
#switch_pin: PG12

[heater_bed]
#heater_pin: PB11
heater_pin: PA1
sensor_pin: PF3 # TB
sensor_type: NTC 100K MGB18-104F39050L32
pwm_cycle_time: 0.017
max_power: 0.6
min_temp: 0
max_temp: 120

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800   # after 30 minutes turn off heaters,LED & de-energize motors unless paused(for runout sensor to not lose spot)
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Paused, keeping bed heated & motors on.
        M104 S0
    {% else %}
        TURN_OFF_HEATERS
        M84 # Disable steppers
        LED_OFF
    {% endif %}

[quad_gantry_level]
##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions

#--------------------------------------------------------------------
##	Gantry Corners for 350mm Build
##	Uncomment for 350mm build
gantry_corners:
	-60,-10
	410,420
##	Probe points
points:
	50,25
	50,275
	300,275
	300,25

#--------------------------------------------------------------------
speed: 300
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
horizontal_move_z: 3
;horizontal_move_z: 11 ; this is for little klicky
;horizontal_move_z: 22 ; this is for big klicky

[bed_mesh]
zero_reference_position: 175, 175
speed: 300
mesh_min: 40, 40
mesh_max: 310,310
probe_count: 20,20
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough
algorithm: bicubic
horizontal_move_z: 3 ; this is for cartograpgher
;horizontal_move_z: 9 ; this is for little Klicky
;horizontal_move_z: 19 ; this is for big Klicky
adaptive_margin: 5

# [safe_z_home]
# home_xy_position: 175, 175

[gcode_arcs] ;enable g2 and g3
resolution: 0.1


####################################################################
# 	X/Y Stepper Settings
#####################################################################
[include fans_temp_sensors.cfg]

# Driver0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
#endstop_pin: !PG6
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 350
position_min: 0
position_max: 350
homing_speed: 100 # max 100
#homing_retract_dist: 5
homing_retract_dist: 0
homing_positive_dir: true

# Driver1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
#endstop_pin: !PG9
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 360
position_min: 0
position_max: 360
homing_speed: 100 # max 100
#homing_retract_dist: 5
homing_retract_dist: 0
homing_positive_dir: true


# Driver4
[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
gear_ratio: 80:16
#endstop_pin: PG10
endstop_pin: probe:z_virtual_endstop
position_max: 300 ; actual = 310
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0
;position_endstop: 1.1 ; worked well with 1.158 just to sticky
;Making the position_endstop value larger / more positive will move the nozzle closer to the print surface.
;Making the position_endstop value smaller / more negative will move the nozzle further from the print surface.

# Driver5
[stepper_z1]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
gear_ratio: 80:16

# Driver6
[stepper_z2]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
gear_ratio: 80:16

#[filament_switch_sensor material_2]
#switch_pin: PG14

# Driver7
[stepper_z3]
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
gear_ratio: 80:16


########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
driver_SGTHRS: 140
run_current: 0.800
hold_current: 0.700
stealthchop_threshold: 0
sense_resistor: 0.110

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9
driver_SGTHRS: 140
run_current: 0.800
hold_current: 0.700
stealthchop_threshold: 0
sense_resistor: 0.110

[tmc2209 stepper_z]
uart_pin: PF2
interpolate: false
run_current: 0.8
hold_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.110

[tmc2209 stepper_z1]
uart_pin: PE4
interpolate: false
run_current: 0.8
hold_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.110

[tmc2209 stepper_z2]
uart_pin: PE1
interpolate: false
run_current: 0.8
hold_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.110

[tmc2209 stepper_z3]
uart_pin: PD3
interpolate: false
run_current: 0.8
hold_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.110


#####################################################################
# 	Displays
#####################################################################

[display]
##	mini12864 LCD Display
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2
menu_timeout: 120

[neopixel btt_mini12864]
##	To control Neopixel RGB in mini12864 display
pin: EXP1_6
chain_count: 3
initial_RED: 0.25
initial_GREEN: 0
initial_BLUE: 0
color_order: RGB

##	Set RGB values on boot up for each Neopixel. 
## Index 1 = Left of knob
## Index 2 = Right of knob
##	Index 3 = display
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
    INITIAL_RGB

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

[neopixel Chamber]
pin: PB0
chain_count: 39



[gcode_macro _CLEAN_NOZZLE_TEMP_CHECK]
gcode:
    {% set final_temp = ([params.FINAL_TEMP | int, 100] | max) + 5 %}
    {% if printer.extruder.temperature > final_temp %}
      NOZZLE_BRUSH
      M400
    {% endif %}

[gcode_macro NOZZLE_BRUSH]
# heat nozzle for best results
variable_x1: 35 # left of brush   <<<edit this value>>>
variable_x2: 80 # right or brush  <<<edit this value>>>
variable_y1: 351 # y value         <<<edit this value>>>
variable_depth: 7.5
variable_start_z: 50 # brush at height, set to 0 to disable   <<<edit this value>>>
gcode:
  
    M400  ;wait for buffer to clear
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28         ;home axes before travel moves
    {% endif %}

    G90
    G0 X{x1} Y{y1} F10000 ;left position
    
    {% set brushlength = x2 - x1 %}
    {% set step = brushlength / 5 %}
    {% set sweeps = (brushlength / step) | round(0, 'floor') | int %} 
    {% set x_dir = namespace(i=1) %}
    {% set y_dir = namespace(i=1) %}
    {% set laps = params.LAPS | default(1) | int %}
    {% for lap in range(laps) %}
      {% for sweep in range(sweeps) %}
        {% set x_dist = x_dir.i * step %}
        {% set y_dist = y_dir.i * depth %}
        
        G91
        G1 X{x_dist} Y{y_dist} F5000
        {% set y_dir.i = -y_dir.i %}
      {% endfor %}
      {% set x_dir.i = -x_dir.i %}
      {% for sweep in range(sweeps) %}
        {% set x_dist = x_dir.i * step %}
        {% set y_dist = y_dir.i * depth %}
        
        G91
        G1 X{x_dist} Y{y_dist} F5000
        {% set y_dir.i = -y_dir.i %}
      {% endfor %}
      {% set x_dir.i = -x_dir.i %}
    {% endfor %}
    G90

[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set brush_temp = params.BRUSH_TEMP|default(250)|int %}
    {% set final_temp = params.FINAL_TEMP|default(150)|int %}
    {% set brush_safe_x = printer["gcode_macro NOZZLE_BRUSH"].x1 - 10 %}
    {% set brush_safe_y = printer["gcode_macro NOZZLE_BRUSH"].y1 - 20 %}
    {% set brush_start_y = printer["gcode_macro NOZZLE_BRUSH"].y1 %}
    {% set brush_start_z = printer["gcode_macro NOZZLE_BRUSH"].start_z %}

      M400  ;wait for buffer to clear
      {% if "xyz" not in printer.toolhead.homed_axes %}
          G28         ;home axes before travel moves
      {% endif %}
  
      G90
      {% if brush_start_z and printer.toolhead.position.z < brush_start_z %}
        G1 Z{brush_start_z} F10000
      {% endif %}
      G1 X{brush_safe_x} Y{brush_safe_y} F10000
      G1 Y{brush_start_y} F10000
      {% if brush_temp and printer.extruder.temperature < brush_temp %}
        M104 S{brush_temp} # Heat nozzle to temp
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={brush_temp} # Wait for nozzle to heat, but dont care if it overshot
      {% endif %}
      M83
      G1 E20 F300         ; 20mm PURGE
      M106 S255 # PCF Fan full
      NOZZLE_BRUSH # First Brush
      M104 S{final_temp} # Turn Off Nozzle
      G1 E-10.0 F3600     ; retract filament
      
      {% for brush in range(100) %}
        _CLEAN_NOZZLE_TEMP_CHECK FINAL_TEMP={final_temp}
      {% endfor %}
      M400
      M106 S0
      G1 X{brush_safe_x} Y{brush_safe_y} F10000
